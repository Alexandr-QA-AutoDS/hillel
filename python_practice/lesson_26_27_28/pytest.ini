[pytest]

; щоб працював `pytest`, а не тільки `python -m pytest`
pythonpath = .

addopts =
    ; не чіпати sys.path: інакше `core` з кореня репозиторію (hillel/core)
    ; перекриває локальний lesson_26_27_28/core
    --import-mode=importlib
    --strict-markers
    --tb=short
    -v

markers =
    ui: ui tests for qauto2 registration
    positive: positive scenarios
    negative: negative scenarios
